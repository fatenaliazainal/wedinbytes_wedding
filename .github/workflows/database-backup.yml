name: Daily production database backup

on:
  schedule:
    # 05:00 Malaysia time (UTC+8) = 21:00 UTC on the previous day.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm that this will run a read-only production backup"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup production database to private R2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Confirm manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "true" ]; then
            echo "Manual backup cancelled: confirmation checkbox was not selected."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run read-only backup
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BACKUP_BUCKET_NAME: ${{ secrets.CF_R2_BACKUP_BUCKET_NAME }}
        run: pnpm --filter @workspace/api-server run backup:db

      - name: Write safe run summary
        if: ${{ success() }}
        run: |
          {
            echo "## Database backup completed"
            echo ""
            echo "- Schedule: 05:00 Malaysia time"
            echo "- Storage: private R2 backup bucket"
            echo "- Database contents were not committed to Git"
            echo "- Upload verification: passed"
          } >> "$GITHUB_STEP_SUMMARY"