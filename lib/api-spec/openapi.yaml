openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Wedding Invitation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: invitation
    description: Wedding invitation operations
  - name: rsvp
    description: RSVP operations
  - name: design
    description: Card design operations
  - name: business
    description: Business Account profiles, clients and invitations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /invitation/{token}:
    get:
      operationId: getInvitation
      tags: [invitation]
      summary: Get wedding invitation details by unique token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wedding invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInvitation
      tags: [invitation]
      summary: Permanently delete an invitation owned by the logged-in customer
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invitation ownership required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}/role:
    patch:
      operationId: updateUserRole
      tags: [business]
      summary: Promote a Buyer to Business Account or return them to Buyer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleBody"
      responses:
        "200":
          description: Updated account role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /business/me:
    get:
      operationId: getMyBusinessProfile
      tags: [business]
      summary: Get the logged-in Business Account profile
      responses:
        "200":
          description: Business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProfile"
    patch:
      operationId: updateMyBusinessProfile
      tags: [business]
      summary: Update the logged-in Business Account profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusinessProfileBody"
      responses:
        "200":
          description: Updated business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProfile"

  /business/clients:
    get:
      operationId: listBusinessClients
      tags: [business]
      summary: List clients owned by the logged-in Business Account
      responses:
        "200":
          description: Business clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessClient"
    post:
      operationId: createBusinessClient
      tags: [business]
      summary: Create a Business Account client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBusinessClientBody"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessClient"

  /business/clients/{id}:
    patch:
      operationId: updateBusinessClient
      tags: [business]
      summary: Update a Business Account client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusinessClientBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessClient"
    delete:
      operationId: deleteBusinessClient
      tags: [business]
      summary: Delete a Business Account client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /business/invitations:
    get:
      operationId: listBusinessInvitations
      tags: [business]
      summary: List invitations owned by the logged-in Business Account
      responses:
        "200":
          description: Business-owned invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessInvitation"

  /business/search:
    get:
      operationId: searchBusinesses
      tags: [business]
      summary: Search active public Business Account profiles
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Business profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicBusinessProfile"

  /business/{slug}:
    get:
      operationId: getBusinessProfile
      tags: [business]
      summary: Get a public Business Account profile by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBusinessProfile"
        "404":
          description: Business profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rsvp:
    get:
      operationId: listRsvps
      tags: [rsvp]
      summary: List all RSVPs
      responses:
        "200":
          description: List of RSVPs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rsvp"
    post:
      operationId: createRsvp
      tags: [rsvp]
      summary: Submit RSVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRsvpBody"
      responses:
        "201":
          description: RSVP created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rsvp"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rsvp/count:
    get:
      operationId: getRsvpCount
      tags: [rsvp]
      summary: Get RSVP count summary
      parameters:
        - name: invitationToken
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: RSVP counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpCount"

  /design/active:
    get:
      operationId: getActiveDesign
      tags: [design]
      summary: Get the currently active card design
      responses:
        "200":
          description: Active card design configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDesign"
        "404":
          description: No active design found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /design:
    get:
      operationId: listDesigns
      tags: [design]
      summary: List all card designs
      responses:
        "200":
          description: All available designs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardDesign"

  /design/{id}/activate:
    post:
      operationId: activateDesign
      tags: [design]
      summary: Set a design as active
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Design activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDesign"
        "404":
          description: Design not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pricing:
    get:
      operationId: listPricing
      tags: [pricing]
      summary: List active pricing packages with features
      responses:
        "200":
          description: List of pricing packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PricingPackage"

  /admin/pricing:
    get:
      operationId: listAdminPricing
      tags: [pricing]
      summary: List all pricing packages with features (admin)
      responses:
        "200":
          description: List of pricing packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PricingPackage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createPricingPackage
      tags: [pricing]
      summary: Create a pricing package (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePricingPackageBody"
      responses:
        "201":
          description: Pricing package created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingPackage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/pricing/{id}:
    patch:
      operationId: updatePricingPackage
      tags: [pricing]
      summary: Update a pricing package (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePricingPackageBody"
      responses:
        "200":
          description: Pricing package updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingPackage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePricingPackage
      tags: [pricing]
      summary: Delete a pricing package (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pricing package deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/pricing/{id}/features:
    post:
      operationId: createPricingFeature
      tags: [pricing]
      summary: Add a feature to a pricing package (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePricingFeatureBody"
      responses:
        "201":
          description: Feature created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingFeature"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/pricing/{id}/features/{featureId}:
    patch:
      operationId: updatePricingFeature
      tags: [pricing]
      summary: Update a pricing feature (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: featureId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePricingFeatureBody"
      responses:
        "200":
          description: Feature updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingFeature"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePricingFeature
      tags: [pricing]
      summary: Delete a pricing feature (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: featureId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Feature deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Invitation:
      type: object
      properties:
        id:
          type: integer
        groomName:
          type: string
        brideName:
          type: string
        eventType:
          type: string
        eventDate:
          type: string
        eventDay:
          type: string
        eventTime:
          type: string
        venueName:
          type: string
        venueAddress:
          type: string
        venueCity:
          type: string
        venueState:
          type: string
        venueMapUrl:
          type: string
        groomParents:
          type: string
        brideParents:
          type: string
        contactPhone:
          type: string
        contacts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              phone:
                type: string
            required:
              - name
              - phone
          maxItems: 4
        dresscode:
          type: string
        message:
          type: string
        coverTitle:
          type: string
        hashtag:
          type: string
        doaText:
          type: string
        galleryImages:
          type: array
          items:
            type: string
          description: Array of gallery image URLs or R2 keys
        language:
          type: string
          default: ms
        packageId:
          type: integer
          nullable: true
        business:
          allOf:
            - $ref: "#/components/schemas/BusinessInvitationSummary"
          nullable: true
      required:
        - id
        - groomName
        - brideName
        - eventType
        - eventDate
        - eventDay
        - eventTime
        - venueName
        - venueAddress
        - venueCity
        - venueState
        - contactPhone

    BusinessProfile:
      type: object
      properties:
        id:
          type: integer
        businessName:
          type: string
        businessType:
          type: string
        displayName:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        instagram:
          type: string
          nullable: true
        facebook:
          type: string
          nullable: true
        tiktok:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        coverImage:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        googleMapsUrl:
          type: string
          nullable: true
        businessHours:
          type: string
          nullable: true
        isVerified:
          type: boolean
        invitationCount:
          type: integer
      required:
        - id
        - businessName
        - businessType
        - displayName
        - slug
        - isVerified

    PublicBusinessProfile:
      type: object
      properties:
        businessName:
          type: string
        businessType:
          type: string
        displayName:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        instagram:
          type: string
          nullable: true
        facebook:
          type: string
          nullable: true
        tiktok:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        coverImage:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        googleMapsUrl:
          type: string
          nullable: true
        businessHours:
          type: string
          nullable: true
        isVerified:
          type: boolean
        invitationCount:
          type: integer
      required:
        - businessName
        - businessType
        - displayName
        - slug
        - isVerified

    BusinessInvitationSummary:
      type: object
      properties:
        businessName:
          type: string
        businessType:
          type: string
        displayName:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        instagram:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
      required:
        - businessName
        - businessType
        - displayName
        - slug

    UpdateBusinessProfileBody:
      type: object
      properties:
        businessName:
          type: string
        businessType:
          type: string
        displayName:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        instagram:
          type: string
          nullable: true
        facebook:
          type: string
          nullable: true
        tiktok:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        coverImage:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        googleMapsUrl:
          type: string
          nullable: true
        businessHours:
          type: string
          nullable: true

    BusinessClient:
      type: object
      properties:
        id:
          type: integer
        businessId:
          type: integer
        brideName:
          type: string
        groomName:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        eventDate:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
      required:
        - id
        - businessId
        - brideName
        - groomName
        - status

    CreateBusinessClientBody:
      type: object
      properties:
        brideName:
          type: string
        groomName:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        eventDate:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string

    UpdateBusinessClientBody:
      allOf:
        - $ref: "#/components/schemas/CreateBusinessClientBody"

    BusinessInvitation:
      allOf:
        - $ref: "#/components/schemas/Invitation"

    UserRole:
      type: string
      enum:
        - buyer
        - business_account

    UpdateUserRoleBody:
      type: object
      properties:
        role:
          type: string
          enum:
            - buyer
            - business_account
      required:
        - role

    UserRoleResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - buyer
            - business_account
      required:
        - id
        - name
        - email
        - role

    Rsvp:
      type: object
      properties:
        id:
          type: integer
        invitationToken:
          type: string
        name:
          type: string
        attending:
          type: boolean
        numberOfGuests:
          type: integer
        timeSlot:
          type: string
        message:
          type: string
        createdAt:
          type: string
      required:
        - id
        - invitationToken
        - name
        - attending
        - numberOfGuests
        - createdAt

    CreateRsvpBody:
      type: object
      properties:
        invitationToken:
          type: string
        name:
          type: string
        attending:
          type: boolean
        numberOfGuests:
          type: integer
        timeSlot:
          type: string
        message:
          type: string
      required:
        - invitationToken
        - name
        - attending
        - numberOfGuests

    RsvpCount:
      type: object
      properties:
        attending:
          type: integer
        notAttending:
          type: integer
        totalGuests:
          type: integer
      required:
        - attending
        - notAttending
        - totalGuests

    CardDesign:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        isActive:
          type: boolean
        designCode:
          type: string
        envelopeImageUrl:
          type: string
        cardImageUrl:
          type: string
        musicUrl:
          type: string
        musicTitle:
          type: string
        musicArtist:
          type: string
        colorPrimary:
          type: string
        colorSecondary:
          type: string
        colorAccent:
          type: string
        colorBackground:
          type: string
        colorCard:
          type: string
        nameFontFamily:
          type: string
        nameColor:
          type: string
        fontHeading:
          type: string
        fontBody:
          type: string
        cardMaxWidth:
          type: string
        openButtonText:
          type: string
        openingAnimation:
          type: string
          description: Animation pattern key e.g. "doors" or "envelope"
      required:
        - id
        - name
        - isActive

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required:
        - error

    PricingPackage:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: string
        description:
          type: string
        badgeText:
          type: string
        showBadge:
          type: boolean
        isFeatured:
          type: boolean
        isActive:
          type: boolean
        sortOrder:
          type: integer
        features:
          type: array
          items:
            $ref: "#/components/schemas/PricingFeature"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - price
        - description
        - badgeText
        - showBadge
        - isFeatured
        - isActive
        - sortOrder
        - features
        - createdAt
        - updatedAt

    PricingFeature:
      type: object
      properties:
        id:
          type: integer
        packageId:
          type: integer
        name:
          type: string
        icon:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - packageId
        - name
        - icon
        - sortOrder
        - createdAt
        - updatedAt

    CreatePricingPackageBody:
      type: object
      properties:
        name:
          type: string
        price:
          type: string
        description:
          type: string
        badgeText:
          type: string
        showBadge:
          type: boolean
        isFeatured:
          type: boolean
        isActive:
          type: boolean
      required:
        - name
        - price

    UpdatePricingPackageBody:
      type: object
      properties:
        name:
          type: string
